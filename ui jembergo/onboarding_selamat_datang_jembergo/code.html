<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>JemberGo - Onboarding</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#007AFF',
              dark: '#005ecb',
              light: '#3897ff'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'glow': '0 8px 24px -4px rgba(0, 122, 255, 0.45)',
          }
        }
      }
    };
  </script>
<!-- Custom Styles for Typography & Safe Areas -->
<style data-purpose="layout-and-reset">
    /* Native App Viewport Constraints */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b111e;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* iOS safe areas handling */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 14px);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-900 font-sans p-0 sm:p-4 selection:bg-brand selection:text-white">
<!-- BEGIN: MobileDeviceContainer -->
<!-- iPhone 15 Pro form-factor mockup wrapper -->
<main class="relative w-full max-w-[400px] h-[844px] max-h-screen sm:max-h-[844px] bg-black sm:rounded-[52px] overflow-hidden shadow-2xl flex flex-col justify-between select-none sm:border-[8px] sm:border-[#1e232d]" data-purpose="mobile-viewport">
<!-- BEGIN: BackgroundHeroImage -->
<!-- Full-bleed scenic ocean and coastal rocks evoking Pantai Papuma/Teluk Love Jember -->
<div class="absolute inset-0 z-0 overflow-hidden" data-purpose="hero-media-container">
<img alt="Pantai Papuma Jember turquoise ocean landscape" class="w-full h-full object-cover object-center transform scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJ-XPy41pMNX0f78dqiqG08c2qzVXllvgHLpp6U7J0s0Q6WIv1U3SqTJot121E7yogVMPlLxpseJUzdllPA1OtnaibdRa9Brp-dwAxp9f-D-KylKQzVRqx7s-7bt9VJ2GjRObrol8PO8MIEo2tigBIlaJqhXls3QlF_O7Uogs9w8ZTOAOzunIXJK_aheUjYag1DY8D3nwDq3Fnuavu6SNTd1DuWrKu3jGXpbQrUjo">
<!-- Bottom rich vignette gradient for high-contrast legible typography -->
<div class="absolute inset-0 bg-gradient-to-t from-black via-black/75 to-transparent via-50% pointer-events-none"></div>
<!-- Subtle top tint for status bar readability -->
<div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-black/40 to-transparent pointer-events-none"></div>
</div>
<!-- END: BackgroundHeroImage -->
<!-- BEGIN: iOSStatusBarAndHeader -->
<header class="relative z-20 pt-safe px-7 pt-3 flex flex-col w-full" data-purpose="ios-top-bar">
<!-- Status Bar Elements -->
<div class="flex items-center justify-between text-white text-[14px] font-semibold tracking-tight w-full">
<!-- iOS Clock -->
<span class="w-12 text-left pl-1">9:41</span>
<!-- Dynamic Island Pill -->
<div class="w-[110px] h-[30px] bg-black rounded-full flex items-center justify-center space-x-1.5 px-3">
<div class="w-2.5 h-2.5 rounded-full bg-[#111] border border-neutral-800"></div>
<div class="w-2 h-2 rounded-full bg-[#051c2c]"></div>
</div>
<!-- Status Icons (Cellular, Wifi, Battery) -->
<div class="flex items-center justify-end space-x-1.5 w-12 text-white">
<!-- Cellular signal -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A10.97 10.97 0 0 1 1 12C1 5.92 5.92 1 12 1s11 4.92 11 11c0 2.33-.73 4.49-1.97 6.25l-.62-.64C21.26 16.07 22 14.12 22 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path>
<rect height="5" rx="1" width="3" x="2" y="16"></rect>
<rect height="8" rx="1" width="3" x="7" y="13"></rect>
<rect height="12" rx="1" width="3" x="12" y="9"></rect>
<rect height="16" rx="1" width="3" x="17" y="5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.25c3.67 0 7.02 1.34 9.61 3.56L12 19.46 2.39 10.81A14.28 14.28 0 0 1 12 7.25z"></path>
</svg>
<!-- Battery icon -->
<div class="w-5 h-2.5 border border-white/90 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-3.5 bg-white rounded-[1.5px]"></div>
</div>
</div>
</div>
<!-- Brand Logo / Badge Overlay -->
<div class="mt-4 flex flex-col justify-center items-center">
  <div class="p-3 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 shadow-xl flex items-center justify-center">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEMNpAiZqBcD28kGEPlO4lDWSiNQxAWwDfli3at-2wDx3uyoyeZR5wbKa6QdWYlDEE0fT0xWMtcr5XezUzxkEuyIoB3SlE9jD_Ci3ork4c9F2EZeUCvvOiFOL-pmApoN_4axtRy0QMjX5zM0mXTEgbgnCsULn_JbAQYZyken_XCSAlAZwX8TXbMHc1FwxytvVuH_8AmIRXj7wMAMgVpbartMDnRJ-PrGjsknN0iNLMT73mDxNgtlMW" alt="JemberGo Official Logo" class="h-14 sm:h-16 w-auto object-contain drop-shadow-md">
  </div>
</div>
</header>
<!-- END: iOSStatusBarAndHeader -->
<!-- Spacer element to push text content into lower-third -->
<div class="flex-grow"></div>
<!-- BEGIN: LowerContentArea -->
<!-- Content container mirroring the reference layout exactly -->
<section class="relative z-20 px-6 pb-safe mb-4 flex flex-col items-center text-center" data-purpose="onboarding-action-card">
<!-- Headline: Bold, prominent, clean line breaks -->
<h1 class="text-white text-[29px] sm:text-[31px] font-bold leading-[1.2] tracking-tight mb-3 px-2">
        Discover the Ultimate<br>
<span class="text-white">Wisata Jember Experience</span>
</h1>
<!-- Subtitle Description -->
<p class="text-neutral-300 text-[13.5px] leading-relaxed max-w-[325px] font-normal mb-8 text-white/75">
        Jelajahi keindahan pantai eksotis, air terjun tersembunyi, dan agrowisata terbaik di Jember dalam satu genggaman.
      </p>
<!-- Primary CTA Pill Button -->
<a class="w-full py-4 px-6 rounded-full bg-white hover:bg-neutral-100 active:scale-[0.98] text-slate-900 font-bold text-[16px] tracking-wide text-center transition-all duration-200 shadow-xl flex items-center justify-center focus:outline-none" data-purpose="primary-cta-button" href="#login">
        Mulai Sekarang
      </a>
<!-- Secondary Navigation Link -->
<div class="mt-4 mb-2 text-[13.5px] text-neutral-300" data-purpose="secondary-login-link">
        Sudah punya akun?
        <a class="text-white font-medium ml-1 underline decoration-white/50 underline-offset-4 hover:decoration-white transition-colors" href="#login">
          Masuk
        </a>
</div>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-white/40 rounded-full mt-5 mx-auto"></div>
</section>
<!-- END: LowerContentArea -->
</main>
<!-- END: MobileDeviceContainer -->




</body></html>
