<!DOCTYPE html><html lang="id"><head>

<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Registrasi Akun - JemberGo</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {

        extend: {
          colors: {
            primary: {

              500: '#0ea5e9',

<style data-purpose="base-styles">
    /* iOS smooth scrolling and frame normalization */

      -webkit-font-smoothing: antialiased;

      margin: 0;

</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-slate-200">
<!-- BEGIN: PhoneShellMockup -->

<!-- Time display -->
<span class="text-[14px] font-semibold tracking-tight">9:41</span>
<!-- Dynamic Island pill -->

<div class="w-2.5 h-2.5 rounded-full bg-[#1a1a1a]"></div>
<div class="w-2 h-2 rounded-full bg-[#0a192f]/60"></div>
</div>
<!-- Network, WiFi & Battery icons -->

<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M1 9h2v3H1V9zm4-3h2v6H5V6zm4-3h2v9H9V3zm4-3h2v12h-2V0z"></path>
</svg>
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 2.5C5.1 2.5 2.5 3.7.7 5.7L0 4.9C2.1 2.7 4.9 1.3 8 1.3s5.9 1.4 8 3.6l-.7.8C13.5 3.7 10.9 2.5 8 2.5zm0 3.8c-1.8 0-3.5.8-4.7 2.1l-.8-.8C4 6 5.9 5.1 8 5.1s4 .9 5.5 2.5l-.8.8C11.5 7.1 9.8 6.3 8 6.3zm0 3.8c-.8 0-1.6.4-2.1 1.1L8 13l2.1-1.8c-.5-.7-1.3-1.1-2.1-1.1z"></path>
</svg>
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-current rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: MainContentArea -->
<!-- Scrollable container for page content -->
<main class="flex-1 overflow-y-auto px-6 pt-2 pb-8 scrollbar-none flex flex-col justify-between" data-purpose="registration-content">
<div>
<!-- BEGIN: TopNavigation -->
<!-- Circular back button style from reference image -->
<nav class="flex items-center justify-between py-2">
<button aria-label="Kembali" class="w-10 h-10 rounded-full bg-white shadow-sm border border-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-50 transition active:scale-95" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYs_45e6sNjDhk8sK2nnlNum6KIt3M3s5CAs9dKbot4dUM3_bE_u4Sguwp4R-gqbHxMZlT9wAxwPBaJXnxNp4INU5M9_2cjeC1T_gVF2v2bGaQAseUEAL5_EaOV9_hFUpmJ5EjW9en0QdTwuYl6si1rdbIAgffHM4GReqIAPUkD3MjMpBn8QIyne8waO3X93wisBAKO78F6Yfh-07LBsF2dgAh8ow6mx_VahC6qDsDKSsLUJlW78nC" alt="JemberGo Logo" class="h-12 w-auto object-contain">
<div class="w-10"></div> <!-- Balance spacing -->
</nav>
<!-- END: TopNavigation -->
<!-- BEGIN: HeadlineSection -->
<div class="mt-4 mb-5">
<h1 class="text-2xl font-bold text-slate-900 tracking-tight">Buat Akun Baru</h1>
<p class="text-[13px] text-slate-500 mt-1 leading-relaxed">
            Daftar sekarang untuk memesan tiket wisata dan jelajahi pesona Jember.
          </p>
</div>
<!-- END: HeadlineSection -->
<!-- BEGIN: RegistrationForm -->
<form class="space-y-3.5" onsubmit="event.preventDefault();">
<!-- Field 1: Nama Lengkap -->
<div class="space-y-1">
<label class="block text-[12px] font-medium text-slate-600">Nama Lengkap</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400 pointer-events-none">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
<input class="w-full bg-white text-slate-800 text-[13px] pl-10 pr-4 py-2.5 rounded-2xl border border-slate-200/90 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 transition placeholder:text-slate-400 shadow-xs" placeholder="misal: Rama Daniswara" type="text">
</div>
</div>
<!-- Field 2: Nomor Telepon / WhatsApp -->
<div class="space-y-1">
<label class="block text-[12px] font-medium text-slate-600">Nomor Telepon / WhatsApp</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400 pointer-events-none">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
<input class="w-full bg-white text-slate-800 text-[13px] pl-10 pr-4 py-2.5 rounded-2xl border border-slate-200/90 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 transition placeholder:text-slate-400 shadow-xs" placeholder="0812-3456-7890" type="tel">
</div>
</div>
<!-- Field 3: Alamat Email -->
<div class="space-y-1">
<label class="block text-[12px] font-medium text-slate-600">Alamat Email</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400 pointer-events-none">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
<input class="w-full bg-white text-slate-800 text-[13px] pl-10 pr-4 py-2.5 rounded-2xl border border-slate-200/90 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 transition placeholder:text-slate-400 shadow-xs" placeholder="nama@email.com" type="email">
</div>
</div>
<!-- Field 4: Kata Sandi -->
<div class="space-y-1">
<label class="block text-[12px] font-medium text-slate-600">Kata Sandi</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400 pointer-events-none">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
<input class="w-full bg-white text-slate-800 text-[13px] pl-10 pr-10 py-2.5 rounded-2xl border border-slate-200/90 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 transition placeholder:text-slate-400 shadow-xs" id="password-input" placeholder="Minimal 8 karakter" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-slate-400 hover:text-slate-600 p-1" id="toggle-password-btn" type="button">
<!-- Eye Icon -->
<svg class="w-4 h-4" fill="none" id="eye-icon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Field 5: Konfirmasi Kata Sandi -->
<div class="space-y-1">
<label class="block text-[12px] font-medium text-slate-600">Konfirmasi Kata Sandi</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400 pointer-events-none">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
<input class="w-full bg-white text-slate-800 text-[13px] pl-10 pr-4 py-2.5 rounded-2xl border border-slate-200/90 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 transition placeholder:text-slate-400 shadow-xs" placeholder="Ketik ulang kata sandi" type="password">
</div>
</div>
<!-- Primary CTA Button (Pill shape inspired by 'Get Started' button in IMAGE_12) -->
<div class="pt-2">
<button class="w-full py-3.5 px-6 rounded-full bg-[#0c192c] hover:bg-[#1a2942] text-white font-medium text-[15px] shadow-md shadow-slate-900/20 active:scale-[0.99] transition duration-150 flex items-center justify-center space-x-2" type="submit">
<span class="">Daftar Akun</span>
</button>
</div>
</form>
<!-- END: RegistrationForm -->
<!-- Divider with Text -->
<div class="flex items-center my-4">
<div class="flex-grow border-t border-slate-200"></div>
<span class="shrink-0 px-3 text-[11px] font-medium text-slate-400 uppercase tracking-wider">atau</span>
<div class="flex-grow border-t border-slate-200"></div>
</div>
<!-- BEGIN: AlternativeSignUp -->
<!-- Google Sign-Up button -->
<button class="w-full py-2.5 px-4 rounded-full border border-slate-200 bg-white hover:bg-slate-50 transition text-slate-700 text-[13px] font-medium flex items-center justify-center space-x-2.5 shadow-2xs active:scale-[0.99]" type="button">
<!-- Google G Logo SVG -->
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Daftar dengan Akun Google</span>
</button>
<!-- END: AlternativeSignUp -->
<!-- Terms and Privacy Policy Note -->
<p class="text-center text-[10.5px] leading-relaxed text-slate-400 mt-3 px-2">
          Dengan mendaftar, Anda menyetujui <a class="underline hover:text-slate-600" href="#">Syarat &amp; Ketentuan</a> serta <a class="underline hover:text-slate-600" href="#">Kebijakan Privasi</a> JemberGo.
        </p>
</div>
<!-- BEGIN: BottomNavigationLink -->
<!-- Login redirect -->
<footer class="pt-4 pb-1 text-center">
<p class="text-[12.5px] text-slate-500">
          Sudah punya akun? 
          <a class="font-semibold text-primary-600 hover:text-primary-700 ml-0.5 underline" href="#">
            Masuk di sini
          </a>
</p>
</footer>
<!-- END: BottomNavigationLink -->
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: iOSHomeIndicator -->
<!-- Authentic bottom swipe handle -->
<div class="w-full flex justify-center pb-2 pt-1 bg-transparent" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: PhoneShellMockup -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-toggle">
    // Simple toggle functionality for Kata Sandi visibility
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-password-btn');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Update SVG icon representation slightly
        toggleBtn.classList.toggle('text-primary-600', isPassword);
        toggleBtn.classList.toggle('text-slate-400', !isPassword);
      });
    }
  </script>
<!-- END: InteractiveScripts -->


</body></html>
